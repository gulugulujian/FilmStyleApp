name: Build APK

# 触发条件：
# - 推送到 main 分支
# - 手动触发（workflow_dispatch）
# - 打 tag（v*）时自动发布到 Release
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 设置 JDK 17（AGP 8.5 需要 JDK 17）
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. 设置 Gradle（自动下载 Gradle 8.7，无需本地 wrapper jar）
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 赋予 gradlew 执行权限（若存在）
      - name: 赋予执行权限
        run: chmod +x gradlew || true

      # 5. 编译 debug APK（无需签名，可直接安装测试）
      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon

      # 6. 编译 release APK（未签名版本，供测试）
      - name: 编译 Release APK
        run: gradle assembleRelease --no-daemon

      # 7. 上传 APK 作为构建产物（可在 Actions 页面直接下载）
      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmStyleApp-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmStyleApp-release
          path: app/build/outputs/apk/release/*.apk

  # 打 tag 时自动发布到 GitHub Release（生成可分享的下载链接）
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: FilmStyleApp-release
          path: artifacts

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
